[project]
name = "cv-rest-mcp-server"
version = "0.1.0"
description = "FastAPI + FastMCP service that renders a CV as JSON or themed PDFs."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "fastmcp>=3.0,<4.0",
    "jinja2>=3.1,<4.0",
    "weasyprint>=62.0",
    "pydantic-settings>=2.0",
    "slowapi>=0.1.10",
    "google-cloud-storage>=3.13.1",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.5",
    "python-dotenv>=1.2.3",
    "PyJWT[crypto]>=2.13,<3.0",
    "cryptography>=45.0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "ruff>=0.6",
    "ty>=0.0.72",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "playwright>=1.49",
    "hypothesis>=6.165.10",
    "testcontainers[postgres]>=4.15.0",
]

[project.urls]
Homepage = "https://github.com/ivanprytula/cv-rest-mcp-server"

[tool.uv.workspace]
members = [
    "services/portfolio",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["services.portfolio"]
lines-after-imports = 2

# api-core is now file/GCS-only. These modules belong to the retired Postgres,
# Pub/Sub, Scheduler, and JD-review subsystems; keep them out of type checking
# until they are either removed or re-enabled with their dependencies.
[tool.ty.src]
exclude = [
    "services/portfolio/alembic",
    "services/portfolio/analysis_worker.py",
    "services/portfolio/auth",
    "services/portfolio/cv_extraction.py",
    "services/portfolio/cv_review",
    "services/portfolio/db.py",
    "services/portfolio/db_migrations.py",
    "services/portfolio/documents/routes.py",
    "services/portfolio/events",
    "services/portfolio/gaps",
    "services/portfolio/matching/clustering.py",
    "services/portfolio/refresh_trigger.py",
    "services/portfolio/revisions",
    "services/portfolio/tests/conftest.py",
    "services/portfolio/tests/test_access_matrix.py",
    "services/portfolio/tests/test_analysis_worker.py",
    "services/portfolio/tests/test_ats.py",
    "services/portfolio/tests/test_ats_sync.py",
    "services/portfolio/tests/test_auth.py",
    "services/portfolio/tests/test_cv_extraction.py",
    "services/portfolio/tests/test_critic_agent.py",
    "services/portfolio/tests/test_matching/test_clustering.py",
    "services/portfolio/tests/test_documents_api.py",
    "services/portfolio/tests/test_events_publisher.py",
    "services/portfolio/tests/test_firestore_store.py",
    "services/portfolio/tests/test_gaps_api.py",
    "services/portfolio/tests/test_gen_secrets.py",
    "services/portfolio/tests/test_idempotency.py",
    "services/portfolio/tests/test_outbox.py",
    "services/portfolio/tests/test_pubsub_publisher.py",
    "services/portfolio/tests/test_review_service.py",
    "services/portfolio/tests/test_tenant_isolation.py",
    "services/portfolio/tests/test_tenancy_type.py",
    "services/portfolio/tests/test_tailor_jwt.py",
    "services/portfolio/tests/test_tracked_boards_api.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--timeout=60 --cov -m 'not e2e and not firestore and not pubsub'"
markers = [
    "e2e: end-to-end browser tests (Playwright); run with `just test-ui`",
    "firestore: needs the Firestore emulator container; run with `just test-firestore`",
    "pubsub: needs the Pub/Sub emulator container; run with `just test-pubsub`",
    "needs_script: shells out to a repo script rather than importing it",
    "slow: per-test testcontainers Postgres + Alembic migrate (2-6s setup each); skip with `-m 'not slow'` for a fast inner loop",
]

[tool.coverage.run]
source = ["services/portfolio"]

[tool.coverage.report]
show_missing = true
