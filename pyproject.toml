[project]
name = "cv-rest-mcp-server"
version = "0.1.0"
description = "FastAPI + FastMCP service that renders a CV as JSON or themed PDFs."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "fastmcp>=3.0,<4.0",
    "jinja2>=3.1,<4.0",
    "weasyprint>=62.0",
    "pydantic-settings>=2.0",
    "slowapi>=0.1.10",
    "google-cloud-storage>=3.13.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.8",
    "ruff>=0.6",
    "ty>=0.0.72",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "httpx>=0.27",
    "playwright>=1.49",
]

[project.urls]
Homepage = "https://github.com/ivanprytula/cv-rest-mcp-server"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
lines-after-imports = 2

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--timeout=60 --cov -m 'not e2e'"
markers = [
    "e2e: end-to-end browser tests (Playwright); run with `just test-ui`",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
