name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify generated CSS
        run: |
          npm run css
          git diff --exit-code -- static/css/site.css
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check

  cost-estimate:
    needs: code-quality
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Infracost CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh

      - name: Generate cost estimate
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown --path terraform \
            --terraform-var-file terraform.tfvars.example \
            --format json --out-file /tmp/infracost.json

      - name: Check cost threshold ($100/month)
        run: |
          MONTHLY_COST=$(jq -r '.totalMonthlyCost' /tmp/infracost.json)
          BUDGET=100
          echo "Estimated monthly cost: \$$MONTHLY_COST"
          if (( $(echo "$MONTHLY_COST > $BUDGET" | bc -l) )); then
            echo "❌ Exceeds budget (\$$BUDGET)"
            exit 1
          else
            echo "✓ Within budget (\$$BUDGET)"
          fi

  tests:
    needs: cost-estimate
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Install Playwright browsers
        run: uv run playwright install chromium
      - name: Install pytest-timeout and pytest-xdist for diagnostics
        run: uv pip install pytest-timeout pytest-xdist
      - name: Run test suite with diagnostics
        run: |
          echo "Starting test run at $(date)"
          START_TIME=$(date +%s)
          uv run pytest --timeout=60 --durations=10 -n auto -m "not needs_script" || TEST_EXIT_CODE=$?
          END_TIME=$(date +%s)
          echo "Test run completed at $(date)"
          echo "Total test time: $((END_TIME - START_TIME)) seconds"
          exit "${TEST_EXIT_CODE:-0}"

  build:
    needs: tests
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    concurrency:
      group: production-build
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build all service images (sequential)
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=${GIT_SHA:0:7}

          build_service() {
            local name="$1" dockerfile="$2"
            local image_sha="gcr.io/${GCP_PROJECT}/${name}:${SHORT_SHA}"
            local image_latest="gcr.io/${GCP_PROJECT}/${name}:latest"

            cat > /tmp/cloudbuild-"${name}".yaml <<EOF
          steps:
            - name: 'gcr.io/cloud-builders/docker'
              args: ['build', '-f', '${dockerfile}', '-t', '${image_sha}', '-t', '${image_latest}', '.']
          images:
            - '${image_sha}'
            - '${image_latest}'
          EOF

            gcloud builds submit --project "${GCP_PROJECT}" \
              --config /tmp/cloudbuild-"${name}".yaml \
              --quiet --async --format='value(id)' > /tmp/build_id_"${name}".txt
            local build_id
            build_id=$(cat /tmp/build_id_"${name}".txt)
            echo "${name} Build ID: $build_id"

            while :; do
              status=$(gcloud builds describe "$build_id" --project "${GCP_PROJECT}" --format='value(status)')
              case "$status" in
                SUCCESS) echo "${name} build succeeded: $build_id"; break ;;
                FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "${name} build failed: $status"; exit 1 ;;
                *) echo "${name} build: $status"; sleep 5 ;;
              esac
            done
          }

          build_service "api-core" "Dockerfile"
          build_service "api-games" "services/games/Dockerfile"
          build_service "spa-origin" "frontend/Dockerfile"

  deploy:
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform apply (deploy new image tags)
        working-directory: terraform
        env:
          GIT_SHA: ${{ github.sha }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_apex_domain: ${{ secrets.TF_VAR_APEX_DOMAIN }}
          TF_VAR_create_dns_zone: ${{ vars.TF_VAR_CREATE_DNS_ZONE }}
          TF_VAR_services: ${{ secrets.TF_VAR_SERVICES_JSON }}
          TF_VAR_host_routing: ${{ secrets.TF_VAR_HOST_ROUTING_JSON }}
          TF_VAR_static_assets: ${{ secrets.TF_VAR_STATIC_ASSETS_JSON }}
          TF_VAR_uploads: ${{ secrets.TF_VAR_UPLOADS_JSON }}
          TF_VAR_jwt_signing_secret_id: ${{ vars.TF_VAR_JWT_SIGNING_SECRET_ID }}
          TF_VAR_setup_github_wif: ${{ vars.TF_VAR_SETUP_GITHUB_WIF }}
          TF_VAR_github_repo: ${{ vars.TF_VAR_GITHUB_REPO }}
          TF_VAR_setup_org_policies: ${{ vars.TF_VAR_SETUP_ORG_POLICIES }}
          TF_VAR_enable_cloud_armor: ${{ vars.TF_VAR_ENABLE_CLOUD_ARMOR }}
        run: |
          SHORT_SHA=${GIT_SHA:0:7}
          TF_VAR_image_overrides=$(cat <<EOF
          {
            "api-core": "gcr.io/${GCP_PROJECT}/api-core:${SHORT_SHA}",
            "api-games": "gcr.io/${GCP_PROJECT}/api-games:${SHORT_SHA}",
            "spa-origin": "gcr.io/${GCP_PROJECT}/spa-origin:${SHORT_SHA}"
          }
          EOF
          )
          export TF_VAR_image_overrides
          terraform apply -auto-approve -target=module.run

  verify:
    needs: deploy
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify deployments
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          for svc in "api-core" "spa-origin" "api-games"; do
            echo "=== $svc service ==="
            gcloud run services describe "$svc" \
              --project "${{ vars.GCP_PROJECT }}" \
              --region "${{ vars.GCP_REGION }}" \
              --format='value(status.url)'
          done
