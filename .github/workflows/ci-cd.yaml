name: Infra CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-cd.yaml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-cd.yaml"

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check

  cost-estimate:
    needs: code-quality
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Infracost CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh

      - name: Generate cost estimate
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown --path terraform \
            --terraform-var-file terraform.tfvars.example \
            --format json --out-file /tmp/infracost.json

      - name: Check cost threshold ($100/month)
        run: |
          MONTHLY_COST=$(jq -r '.totalMonthlyCost' /tmp/infracost.json)
          BUDGET=100
          echo "Estimated monthly cost: \$$MONTHLY_COST"
          if (( $(echo "$MONTHLY_COST > $BUDGET" | bc -l) )); then
            echo "❌ Exceeds budget (\$$BUDGET)"
            exit 1
          else
            echo "✓ Within budget (\$$BUDGET)"
          fi

  terraform-plan:
    needs: cost-estimate
    runs-on: ubuntu-latest
    concurrency:
      group: infra-plan-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_apex_domain: ${{ secrets.TF_VAR_APEX_DOMAIN }}
          TF_VAR_create_dns_zone: ${{ vars.TF_VAR_CREATE_DNS_ZONE }}
          TF_VAR_services: ${{ secrets.TF_VAR_SERVICES_JSON }}
          TF_VAR_host_routing: ${{ secrets.TF_VAR_HOST_ROUTING_JSON }}
          TF_VAR_static_assets: ${{ secrets.TF_VAR_STATIC_ASSETS_JSON }}
          TF_VAR_uploads: ${{ secrets.TF_VAR_UPLOADS_JSON }}
          TF_VAR_jwt_signing_secret_id: ${{ vars.TF_VAR_JWT_SIGNING_SECRET_ID }}
          TF_VAR_setup_github_wif: ${{ vars.TF_VAR_SETUP_GITHUB_WIF }}
          TF_VAR_github_repo: ${{ vars.TF_VAR_GITHUB_REPO }}
        run: terraform plan -out=tfplan -no-color

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: terraform
        run: |
          {
            echo "### Terraform Plan"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } > /tmp/plan-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/plan-comment.md

  terraform-apply:
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: infra-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform apply (reviewed plan)
        working-directory: terraform
        run: terraform apply tfplan
