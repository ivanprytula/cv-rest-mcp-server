name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify generated CSS
        run: |
          npm run css
          git diff --exit-code -- static/css/site.css
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check

  cost-estimate:
    needs: code-quality
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Infracost CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh

      - name: Generate cost estimate
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown --path terraform \
            --terraform-var-file terraform.tfvars.example \
            --format json --out-file /tmp/infracost.json

      - name: Check cost threshold ($100/month)
        run: |
          MONTHLY_COST=$(jq -r '.totalMonthlyCost' /tmp/infracost.json)
          BUDGET=100
          echo "Estimated monthly cost: \$$MONTHLY_COST"
          if (( $(echo "$MONTHLY_COST > $BUDGET" | bc -l) )); then
            echo "❌ Exceeds budget (\$$BUDGET)"
            exit 1
          else
            echo "✓ Within budget (\$$BUDGET)"
          fi

  tests:
    needs: cost-estimate
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Install Playwright browsers
        run: uv run playwright install chromium
      - name: Install pytest-timeout and pytest-xdist for diagnostics
        run: uv pip install pytest-timeout pytest-xdist
      - name: Run test suite with diagnostics
        run: |
          echo "Starting test run at $(date)"
          START_TIME=$(date +%s)
          uv run pytest --timeout=60 --durations=10 -n auto -m "not needs_script" || TEST_EXIT_CODE=$?
          END_TIME=$(date +%s)
          echo "Test run completed at $(date)"
          echo "Total test time: $((END_TIME - START_TIME)) seconds"
          exit "${TEST_EXIT_CODE:-0}"

  build:
    needs: tests
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    concurrency:
      group: production-build
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build all service images (sequential)
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=${GIT_SHA:0:7}

          build_service() {
            local name="$1" dockerfile="$2"
            local image_sha="gcr.io/${GCP_PROJECT}/${name}:${SHORT_SHA}"
            local image_latest="gcr.io/${GCP_PROJECT}/${name}:latest"

            cat > /tmp/cloudbuild-"${name}".yaml <<EOF
          steps:
            - name: 'gcr.io/cloud-builders/docker'
              args: ['build', '-f', '${dockerfile}', '-t', '${image_sha}', '-t', '${image_latest}', '.']
          images:
            - '${image_sha}'
            - '${image_latest}'
          EOF

            gcloud builds submit --project "${GCP_PROJECT}" \
              --config /tmp/cloudbuild-"${name}".yaml \
              --quiet --async --format='value(id)' > /tmp/build_id_"${name}".txt
            local build_id
            build_id=$(cat /tmp/build_id_"${name}".txt)
            echo "${name} Build ID: $build_id"

            while :; do
              status=$(gcloud builds describe "$build_id" --project "${GCP_PROJECT}" --format='value(status)')
              case "$status" in
                SUCCESS) echo "${name} build succeeded: $build_id"; break ;;
                FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "${name} build failed: $status"; exit 1 ;;
                *) echo "${name} build: $status"; sleep 5 ;;
              esac
            done
          }

          build_service "api-core" "Dockerfile"
          build_service "api-games" "services/games/Dockerfile"
          build_service "spa-origin" "frontend/Dockerfile"

  deploy:
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify deployment identity
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          echo "Target project: ${GCP_PROJECT}"
          echo "Authenticated account:"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud projects describe "${GCP_PROJECT}" \
            --format='value(projectId,projectNumber)' \
            --verbosity=error

      - name: Deploy all services to Cloud Run (sequential)
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GIT_SHA: ${{ github.sha }}
          API_CORE_ENV_VARS: "TRUST_PROXY=true,CLIENT_IP_XFF_ENTRY=2,FAILBAN_THRESHOLD=6,CV_REFRESH_SECONDS=30,CORS_ORIGINS=https://app.example.com,CONTACT_NAME=${{ vars.CONTACT_NAME }},CONTACT_EMAIL=${{ vars.CONTACT_EMAIL }}"
        run: |
          SHORT_SHA=${GIT_SHA:0:7}

          deploy_service() {
            local name="$1" svc_name="$2" memory="$3" cpu="$4" env_vars="$5"
            local env_vars_arg=()
            if [ -n "$env_vars" ]; then
              env_vars_arg=(--set-env-vars "$env_vars")
            fi
            gcloud run deploy "$svc_name" \
              --project "${GCP_PROJECT}" \
              --region "${GCP_REGION}" \
              --image "gcr.io/${GCP_PROJECT}/${name}:${SHORT_SHA}" \
              --allow-unauthenticated \
              "${env_vars_arg[@]}" \
              --memory "$memory" \
              --cpu "$cpu" \
              --max-instances 1 \
              --min-instances 0 \
              --service-account "${name}-runtime@${GCP_PROJECT}.iam.gserviceaccount.com"
          }

          deploy_service "api-core" "api-core" "512Mi" "1" "${API_CORE_ENV_VARS}"
          deploy_service "api-games" "api-games" "256Mi" "1" ""
          deploy_service "spa-origin" "spa-origin" "128Mi" "1" ""

  verify:
    needs: deploy
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify deployments
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          for svc in "api-core" "spa-origin" "api-games"; do
            echo "=== $svc service ==="
            gcloud run services describe "$svc" \
              --project "${{ vars.GCP_PROJECT }}" \
              --region "${{ vars.GCP_REGION }}" \
              --format='value(status.url)'
          done
