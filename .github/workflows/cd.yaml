name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check

  tests:
    needs: code-quality
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run test suite
        run: uv run pytest

  deploy:
    needs: [code-quality, tests]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify deployment identity
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          echo "Target project: ${GCP_PROJECT}"
          echo "Authenticated account:"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud projects describe "${GCP_PROJECT}" \
            --format='value(projectId,projectNumber)' \
            --verbosity=error

      - name: Build
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          SVC_NAME: ${{ vars.SVC_NAME }}
        run: scripts/deploy-cloud-run.sh build

      - name: Deploy
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          SVC_NAME: ${{ vars.SVC_NAME }}
        run: scripts/deploy-cloud-run.sh deploy

      - name: Verify and print URL
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          SVC_NAME: ${{ vars.SVC_NAME }}
        run: scripts/deploy-cloud-run.sh verify
