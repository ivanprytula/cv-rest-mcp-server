name: App Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "frontend/**"
      - "services/**"
      - "static/**"
      - "templates/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "frontend/**"
      - "services/**"
      - "static/**"
      - "templates/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-app.yml"

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify generated CSS
        run: |
          npm run css
          git diff --exit-code -- static/css/site.css
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check

  tests:
    needs: code-quality
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Install Playwright browsers
        run: uv run playwright install chromium
      - name: Install pytest-timeout and pytest-xdist for diagnostics
        run: uv pip install pytest-timeout pytest-xdist
      - name: Run test suite with diagnostics
        run: |
          echo "Starting test run at $(date)"
          START_TIME=$(date +%s)
          uv run pytest --timeout=60 --durations=10 -n auto -m "not needs_script" || TEST_EXIT_CODE=$?
          END_TIME=$(date +%s)
          echo "Test run completed at $(date)"
          echo "Total test time: $((END_TIME - START_TIME)) seconds"
          exit "${TEST_EXIT_CODE:-0}"

  build:
    needs: tests
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    concurrency:
      group: app-build
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build all service images (sequential)
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=${GIT_SHA:0:7}
          REPO="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/cv-images"

          build_service() {
            local name="$1" dockerfile="$2"
            local image_sha="${REPO}/${name}:${SHORT_SHA}"
            local image_latest="${REPO}/${name}:latest"

            cat > /tmp/cloudbuild-"${name}".yaml <<EOF
          steps:
            - name: 'gcr.io/cloud-builders/docker'
              args: ['build', '-f', '${dockerfile}', '-t', '${image_sha}', '-t', '${image_latest}', '.']
          images:
            - '${image_sha}'
            - '${image_latest}'
          EOF

            gcloud builds submit --project "${GCP_PROJECT}" \
              --config /tmp/cloudbuild-"${name}".yaml \
              --quiet --async --format='value(id)' > /tmp/build_id_"${name}".txt
            local build_id
            build_id=$(cat /tmp/build_id_"${name}".txt)
            echo "${name} Build ID: $build_id"

            while :; do
              status=$(gcloud builds describe "$build_id" --project "${GCP_PROJECT}" --format='value(status)')
              case "$status" in
                SUCCESS) echo "${name} build succeeded: $build_id"; break ;;
                FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "${name} build failed: $status"; exit 1 ;;
                *) echo "${name} build: $status"; sleep 5 ;;
              esac
            done
          }

          build_service "api-core" "Dockerfile"
          build_service "api-games" "services/games/Dockerfile"
          build_service "spa-origin" "frontend/Dockerfile"

  deploy:
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    concurrency:
      group: app-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          # gcloud run deploy performs an actAs check on the runtime service
          # account; the plain WIF external_account credential fails that
          # check (see commit 05346cb history). access_token exchanges for
          # an impersonated_service_account credential, which actAs accepts.
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Debug active identity
        run: |
          gcloud auth list
          gcloud config list account
          echo "--- testIamPermissions on api-core-runtime ---"
          curl -s -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            -d '{"permissions": ["iam.serviceAccounts.actAs"]}' \
            "https://iam.googleapis.com/v1/projects/${{ vars.GCP_PROJECT }}/serviceAccounts/api-core-runtime@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com:testIamPermissions"

      - name: Deploy new image tags to Cloud Run
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=${GIT_SHA:0:7}
          REPO="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/cv-images"

          for svc in "api-core" "api-games" "spa-origin"; do
            gcloud run deploy "$svc" \
              --project "${GCP_PROJECT}" \
              --region "${GCP_REGION}" \
              --image "${REPO}/${svc}:${SHORT_SHA}" \
              --quiet
          done

  verify:
    needs: deploy
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify deployments
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          for svc in "api-core" "spa-origin" "api-games"; do
            echo "=== $svc service ==="
            gcloud run services describe "$svc" \
              --project "${{ vars.GCP_PROJECT }}" \
              --region "${{ vars.GCP_REGION }}" \
              --format='value(status.url)'
          done
