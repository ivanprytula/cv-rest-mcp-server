name: Infra CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-cd.yml"

permissions:
  contents: read

jobs:
  terraform-quality:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - name: tflint
        run: tflint --chdir terraform --config .tflint.hcl
      - name: checkov
        run: |
          uvx --from 'checkov' checkov -d terraform --quiet --compact \
            --skip-check CKV_GCP_62,CKV_GCP_114,CKV_GCP_28,CKV_GCP_125,CKV_GCP_49,CKV_GCP_41,CKV_GCP_73,CKV_GCP_84,CKV_GCP_6,CKV_GCP_79,CKV_GCP_109,CKV_GCP_60

  cost-estimate:
    needs: terraform-quality
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.job }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # The official action retries and verifies the download. The previous
      # `curl ... | sh` swallowed network failures (curl exit 35 left no binary,
      # and the next step died with "infracost: command not found").
      - name: Install Infracost CLI
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost estimate
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown --path terraform \
            --terraform-var-file terraform.tfvars.example \
            --format json --out-file /tmp/infracost.json

      - name: Check cost threshold ($100/month)
        run: |
          MONTHLY_COST=$(jq -r '.totalMonthlyCost' /tmp/infracost.json)
          BUDGET=100
          echo "Estimated monthly cost: \$$MONTHLY_COST"
          if (( $(echo "$MONTHLY_COST > $BUDGET" | bc -l) )); then
            echo "❌ Exceeds budget (\$$BUDGET)"
            exit 1
          else
            echo "✓ Within budget (\$$BUDGET)"
          fi

  terraform-plan:
    needs: cost-estimate
    runs-on: ubuntu-latest
    concurrency:
      group: infra-plan-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      # Single source of truth: the operator's real terraform.tfvars (gitignored
      # locally) is stored whole as one secret. This replaces ~15 individual
      # TF_VAR_* secrets/vars that had to be updated by hand every time a new
      # variable was added to tfvars — that manual sync was skipped for
      # api_core_secret_ids and Terraform silently destroyed two IAM bindings
      # on the next CI apply. One file, one place to edit, no drift possible.
      - name: Write terraform.tfvars
        working-directory: terraform
        env:
          TF_VARS_FILE: ${{ secrets.TF_VARS_FILE }}
        # The secret must never be interpolated directly into the run: script
        # text (i.e. never `echo "${{ secrets.X }}"`) — GitHub substitutes it
        # into the generated shell script BEFORE bash parses it, so any "
        # or other shell-special character inside the secret's own content
        # corrupts the command. Passing it via env: and reading with $VAR
        # keeps it a single opaque shell value bash never re-parses.
        run: printf '%s' "$TF_VARS_FILE" > terraform.tfvars

      - name: Terraform plan
        id: plan
        working-directory: terraform
        run: terraform plan -out=tfplan -no-color

      - name: Remove terraform.tfvars
        if: always()
        working-directory: terraform
        run: rm -f terraform.tfvars

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          # Must outlive the approval gate on the production environment: an apply
          # waiting on a reviewer can't download an expired artifact. A plan
          # that goes stale is rejected by Terraform itself (state serial
          # mismatch), so a longer window trades no safety.
          retention-days: 5

      # Rendered once, reused by both review surfaces below. Truncated to stay
      # under GitHub's 1MB job-summary cap (and the 65KB PR-comment cap);
      # the untruncated plan is in this job's log and the tfplan artifact.
      - name: Render plan
        working-directory: terraform
        run: |
          terraform show -no-color tfplan > /tmp/plan.txt
          terraform show -no-color tfplan | tail -1 > /tmp/plan-summary.txt

          {
            echo "### Terraform Plan"
            echo ""
            echo "\`$(cat /tmp/plan-summary.txt)\`"
            echo ""
            echo '```terraform'
            head -c 60000 /tmp/plan.txt
            if [ "$(wc -c < /tmp/plan.txt)" -gt 60000 ]; then
              echo ""
              echo "... truncated — see the full plan in this job's log."
            fi
            echo '```'
          } > /tmp/plan-body.md

      # Shows the plan on the run's own page, directly above the approval
      # button for the production environment. Works on push, unlike the PR comment.
      - name: Plan to job summary
        run: cat /tmp/plan-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/plan-body.md

  terraform-apply:
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: infra-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform apply (reviewed plan)
        working-directory: terraform
        run: terraform apply tfplan
