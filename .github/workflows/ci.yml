name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      # `just code-quality` formats in place; CI only verifies.
      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

  tests:
    needs: code-quality # don't burn test minutes on lint/format failures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # e2e (Playwright) tests are excluded by pytest config; run via just test-ui locally.
      - name: Run test suite
        run: uv run pytest
