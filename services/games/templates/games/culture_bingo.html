<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    {% include "_theme_head.html" %}
    <style>
        :root {
            --gap: 8px;
            --radius: 10px;
            --fill-split: 50%;
            --bg: #101318;
            --text: #f4f5c7;
            --text-muted: #aeb5c0;
            --text-status: #cbd0d8;
            --cell-bg: rgba(20,24,30,.96);
            --cell-text: #f7f8fa;
            --cell-detail: #94a3b8;
            --cell-detail-selected: rgba(255,255,255,.85);
            --cell-hover: #252b34;
            --cell-border: rgba(255,255,255,.18);
            --fill-green: rgba(52,92,55,.97);
            --fill-red: rgba(120,38,38,.97);
            --fill-yellow: rgba(118,100,22,.97);
            --link-hover: #f4f5c7;
            --complete-bg: rgba(0,0,0,.55);
            --complete-badge: rgba(15,20,30,.92);
        }

        .dark {
            --bg: #101318;
            --text: #f4f5c7;
            --text-muted: #aeb5c0;
            --text-status: #cbd0d8;
            --cell-bg: rgba(20,24,30,.96);
            --cell-text: #f7f8fa;
            --cell-detail: #94a3b8;
            --cell-detail-selected: rgba(255,255,255,.85);
            --cell-hover: #252b34;
            --cell-border: rgba(255,255,255,.18);
            --fill-green: rgba(52,92,55,.97);
            --fill-red: rgba(120,38,38,.97);
            --fill-yellow: rgba(118,100,22,.97);
            --link-hover: #f4f5c7;
            --complete-bg: rgba(0,0,0,.55);
            --complete-badge: rgba(15,20,30,.92);
        }

        :root:not(.dark) {
            --bg: #f8fafc;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-status: #475569;
            --cell-bg: rgba(255,255,255,.96);
            --cell-text: #1e293b;
            --cell-detail: #475569;
            --cell-detail-selected: #334155;
            --cell-hover: #f1f5f9;
            --cell-border: rgba(0,0,0,.12);
            --fill-green: #c3e8cb;
            --fill-red: #f6cfcf;
            --fill-yellow: #f3e9b8;
            --link-hover: #1e293b;
            --complete-bg: rgba(255,255,255,.7);
            --complete-badge: rgba(255,255,255,.95);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
        }

        .app {
            width: min(1100px, 100%);
            padding: 16px 12px 32px;
        }

        /* The theme toggle is position:fixed in the top-right corner, so the
           header reserves that corner. The gutter is symmetric to keep the
           title dead-centre; a title too long for one line wraps instead of
           sliding under the button. */
        header {
            text-align: center;
            padding: 0 52px;
        }

        h1 {
            font-size: clamp(1.3rem, 5.5vw, 2rem);
            font-weight: 800;
            margin: 0;
            overflow-wrap: break-word;
        }

        .subtitle {
            color: var(--text-muted);
            margin: .35rem 0 .6rem;
            font-size: .9rem;
        }

        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2px 12px;
            font-size: .85rem;
            color: var(--text-status);
            margin-bottom: 6px;
        }

        .game {
            position: relative;
            width: 100%;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, #334b75, transparent 35%),
                radial-gradient(circle at 80% 70%, #75402e, transparent 35%),
                linear-gradient(135deg, #1d4d57, #5c2944);
        }

        /* minmax(0, 1fr) — not 1fr. A bare 1fr is minmax(auto, 1fr), so a long
           tile word floors its track at min-content; the tracks then stop being
           equal, the total exceeds the grid, and .game's overflow:hidden clips
           the last column. */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: var(--gap);
            padding: var(--gap);
        }

        .cell {
            border: 1px solid var(--cell-border);
            border-radius: var(--radius);
            background: var(--cell-bg);
            color: var(--cell-text);
            padding: 9px 10px;
            cursor: pointer;
            text-align: left;
            font: inherit;
            font-size: 14px;
            line-height: 1.35;
            overflow-wrap: break-word;
            min-height: 3.5em;
            transition: opacity .25s ease, background .16s ease;
        }

        .cell small {
            display: block;
            margin-top: 5px;
            color: var(--cell-detail);
            font-size: 12px;
            line-height: 1.3;
        }

        .cell:hover { background: var(--cell-hover); }

        /* Selected: flag colour fills the top-left half, the base cell colour
           keeps the other half. Text stays on --cell-text / --cell-detail-selected
           so it reads on both halves in either theme. */
        .cell.selected-green small,
        .cell.selected-red small,
        .cell.selected-yellow small { color: var(--cell-detail-selected); }

        .cell.selected-green {
            background-image: linear-gradient(135deg,
                var(--fill-green) 0 var(--fill-split),
                var(--cell-bg) var(--fill-split) 100%);
            border-color: rgba(130,200,130,.35);
        }

        .cell.selected-red {
            background-image: linear-gradient(135deg,
                var(--fill-red) 0 var(--fill-split),
                var(--cell-bg) var(--fill-split) 100%);
            border-color: rgba(210,110,110,.35);
        }

        .cell.selected-yellow {
            background-image: linear-gradient(135deg,
                var(--fill-yellow) 0 var(--fill-split),
                var(--cell-bg) var(--fill-split) 100%);
            border-color: rgba(210,190,80,.35);
        }

        .cell-ghost {
            background: transparent;
            border-color: transparent;
            pointer-events: none;
        }

        /* Overlay — continue/replay. Fixed to the viewport, not to the board:
           the board is taller than a phone screen, so an overlay anchored to
           the grid's centre lands off-screen depending on where the player
           happened to scroll when the last tile was revealed. */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: var(--complete-bg);
            opacity: 0;
            pointer-events: none;
            transition: opacity .4s ease;
            padding: 1rem;
            text-align: center;
            overflow: auto;
            overscroll-behavior: contain;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-card {
            background: var(--complete-badge);
            border-radius: 14px;
            padding: 1.1rem 1rem;
            max-width: 360px;
            width: 100%;
            color: var(--text);
        }

        .overlay-card h2 {
            margin: 0 0 1rem;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .overlay-actions {
            display: flex;
            gap: .6rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 8px;
            padding: 9px 20px;
            font: inherit;
            font-size: .875rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .15s ease;
        }

        .btn:hover { opacity: .85; }

        .btn-continue {
            background: #2563eb;
            color: #fff;
            border-color: transparent;
        }

        .btn-replay {
            background: transparent;
            color: var(--text-muted);
        }

        .controls {
            text-align: center;
            margin-top: 12px;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid rgba(128,128,128,.35);
            border-radius: 8px;
            padding: 7px 16px;
            font: inherit;
            font-size: .8rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: opacity .15s ease;
        }

        .btn-reset:hover { opacity: .7; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: .875rem;
        }

        .back-link:hover { color: var(--link-hover); }

        /* Touch-sized targets. The controls are finger-operated, so every
           interactive element keeps a >=44px hit area (WCAG 2.5.5) even
           though the visual size stays compact. */
        @media (pointer: coarse) {
            .btn, .btn-reset { min-height: 44px; }

            .btn-reset { display: inline-flex; align-items: center; padding: 7px 20px; }

            .back-link { min-height: 44px; padding: 0 8px; display: block; line-height: 44px; }

            #theme-toggle {
                width: 44px;
                height: 44px;
                display: grid;
                place-items: center;
                padding: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }

        /* Column ladder. Two columns is the only readable option on a 375px
           phone (a 4-up tile leaves ~50px of text width); the batch is a
           vertical scroll either way. */
        @media (min-width: 480px)  { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (min-width: 768px)  {
            .app { padding: 24px 16px 42px; }
            header { padding: 0; }
            .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .cell { font-size: 13px; padding: 10px 12px; }
            .cell small { font-size: 11px; }
        }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    </style>
</head>
<body>
    {% include "_theme_toggle.html" %}
    <main class="app">
        <header>
            <h1>{{ title }}</h1>
            <p class="subtitle">Click a tile to reveal its flag.</p>
        </header>

        <div class="status">
            <span id="progress" aria-live="polite">Loading…</span>
            <span id="page-indicator"></span>
        </div>

        <section class="game" aria-label="Interactive bingo game">
            <div id="grid" class="grid"></div>

            <div id="overlay" class="overlay" role="status" aria-live="polite">
                <div class="overlay-card">
                    <h2 id="overlay-heading">Batch complete</h2>
                    <div class="overlay-actions">
                        <button class="btn btn-continue" id="btn-continue" hidden>Continue →</button>
                        <button class="btn btn-replay" id="btn-replay">Replay from start</button>
                    </div>
                </div>
            </div>
        </section>

        <div class="controls">
            <button class="btn-reset" id="btn-reset">Reset this batch</button>
        </div>

        <a href="{{ portfolio_base_url }}/" class="back-link">&larr; Back to portfolio</a>
    </main>

    <script type="application/json" id="bingo-config">
    {"page_size": {{ page_size }}, "total_cards": {{ total_cards }}, "total_pages": {{ total_pages }}}
    </script>

    <script>
        const _cfg = JSON.parse(document.getElementById("bingo-config").textContent);
        const STORAGE_KEY = "bingo_progress_v2";
        const PAGE_SIZE = _cfg.page_size;
        const TOTAL_CARDS = _cfg.total_cards;
        const TOTAL_PAGES = _cfg.total_pages;

        // --- State ---
        // { page: int, revealed: {[id]: "green"|"red"|"yellow"} }
        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const s = JSON.parse(raw);
                    // Wipe if saved against a different card set (content update or pre-paging data)
                    if (s.total_cards === TOTAL_CARDS) return s;
                }
            } catch (_) {}
            return { page: 0, total_cards: TOTAL_CARDS, revealed: {} };
        }

        function saveState(s) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify({...s, total_cards: TOTAL_CARDS})); } catch (_) {}
        }

        function clearState() {
            try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
        }

        let state = loadState();
        let currentCells = [];   // cards for this page, in order

        // --- Fetch cards from API ---
        async function fetchPage(page) {
            const resp = await fetch(`/api/v1/culture-bingo/cards?page=${page}`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return resp.json();
        }

        // --- Render ---
        function colorClass(id) {
            if (id.startsWith("red-"))    return "selected-red";
            if (id.startsWith("yellow-")) return "selected-yellow";
            return "selected-green";
        }

        function renderGrid(cells) {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            // Always render PAGE_SIZE slots so the grid height is consistent across batches
            for (let i = 0; i < PAGE_SIZE; i++) {
                const cell = cells[i];
                const btn = document.createElement(cell ? "button" : "div");
                if (cell) {
                    const [title, detail] = cell.content.split("*", 2);
                    btn.type = "button";
                    btn.className = "cell";
                    btn.dataset.id = cell.id;
                    btn.innerHTML = title + (detail ? `<small>${detail}</small>` : "");
                    const savedColor = state.revealed[cell.id];
                    if (savedColor) btn.classList.add(`selected-${savedColor}`);
                    btn.addEventListener("click", () => handleClick(cell.id, btn));
                } else {
                    btn.className = "cell cell-ghost";
                    btn.setAttribute("aria-hidden", "true");
                }
                grid.appendChild(btn);
            }
        }

        function updateProgress() {
            const total = currentCells.length;
            const revealed = currentCells.filter(c => state.revealed[c.id] !== undefined).length;
            document.getElementById("progress").textContent =
                `${revealed} / ${total} revealed`;
            document.getElementById("page-indicator").textContent =
                `Batch ${state.page + 1} of ${TOTAL_PAGES}`;
        }

        // --- Interaction ---
        // One click reveals the tile's flag (diagonal split fill) and counts it.
        // A revealed tile is final for the batch — clicking it again is a no-op,
        // and "Reset this batch" is the only way back.
        function handleClick(id, el) {
            if (state.revealed[id]) return;
            const color = id.startsWith("red-") ? "red"
                : id.startsWith("yellow-") ? "yellow"
                : "green";
            el.classList.add(`selected-${color}`);
            state.revealed[id] = color;
            saveState(state);
            updateProgress();
            checkBatchComplete();
        }

        function checkBatchComplete() {
            if (currentCells.every(c => state.revealed[c.id] !== undefined)) showOverlay();
        }

        // --- Overlay ---
        function showOverlay(isFinal = false) {
            const isLast = state.page >= TOTAL_PAGES - 1;
            const done = isLast || isFinal;
            const heading = document.getElementById("overlay-heading");
            const btnContinue = document.getElementById("btn-continue");

            heading.textContent = done ? "All cards seen!" : `Batch ${state.page + 1} done`;
            btnContinue.hidden = done;

            document.getElementById("overlay").classList.add("show");
        }

        // --- Controls ---
        document.getElementById("btn-continue").addEventListener("click", async (e) => {
            e.currentTarget.blur();
            const nextPage = state.page + 1;
            if (nextPage >= TOTAL_PAGES) return;
            state.page = nextPage;
            saveState(state);
            await loadBatch(state.page);
            document.getElementById("overlay").classList.remove("show");
        });

        document.getElementById("btn-replay").addEventListener("click", async (e) => {
            e.currentTarget.blur();
            clearState();
            state = { page: 0, total_cards: TOTAL_CARDS, revealed: {} };
            await loadBatch(0);
            document.getElementById("overlay").classList.remove("show");
        });

        document.getElementById("btn-reset").addEventListener("click", async (e) => {
            e.currentTarget.blur();
            // Reset only the current batch's revealed tiles; keep the current page
            currentCells.forEach(c => delete state.revealed[c.id]);
            saveState(state);
            renderGrid(currentCells);
            updateProgress();
            document.getElementById("overlay").classList.remove("show");
        });

        // --- Init ---
        async function loadBatch(page) {
            try {
                const data = await fetchPage(page);
                currentCells = data.cells;
                renderGrid(currentCells);
                updateProgress();
            } catch (err) {
                console.error("Failed to load cards:", err);
                document.getElementById("progress").textContent = "Failed to load cards — try refreshing.";
            }
        }

        loadBatch(state.page);
    </script>
</body>
</html>
