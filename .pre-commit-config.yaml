repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: \.(py|md|toml|yaml|yml)$
      - id: end-of-file-fixer
        files: \.(py|md|toml|yaml|yml)$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Skip shellcheck linting in workflows; GitHub Actions context differs from bash
        args: ["-shellcheck="]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: infracost_breakdown
        args:
          - --args=--path=terraform
          - --args=--terraform-var-file=terraform.tfvars.example
        stages: [manual]  # Run manually only: `pre-commit run --hook-stage manual`
  - repo: local
    hooks:
      - id: ty
        name: ty (staged files)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: true
      - id: terraform-fmt
        name: terraform fmt (format)
        entry: terraform fmt -check -recursive
        files: ^terraform/
        language: system
        pass_filenames: false
      - id: terraform-tflint
        name: tflint (terraform logic)
        # --config is resolved relative to --chdir (terraform/), hence .tflint.hcl.
        entry: tflint --chdir terraform --config .tflint.hcl
        files: ^terraform/
        language: system
        pass_filenames: false
      - id: terraform-checkov
        name: checkov (terraform security)
        # Isolated via uvx — checkov pins packaging<24.0 and would conflict
        # with fastmcp (packaging>=24.0) in the project venv.
        # CKV_GCP_62/114/28: Cloud CDN origin bucket must be publicly readable (by design)
        # CKV_GCP_125: WIF provider attribute_condition is security best-practice for OIDC
        # CKV_GCP_49/41: Deployer SA needs actAs role for CI/CD automation (scoped to deployer only)
        # CKV_GCP_73: Cloud Armor module exists but is disabled (enable_cloud_armor = false in tfvars)
        # CKV_GCP_84: Google-managed encryption is sufficient for a single dev env; CSEK adds KMS
        # key management overhead with no corresponding threat model here.
        # CKV_GCP_6: checks for the deprecated require_ssl attribute, removed in
        # hashicorp/google ~> 6.0. cloud_sql module sets its replacement,
        # ssl_mode = "ENCRYPTED_ONLY", which the static check doesn't recognize.
        # CKV_GCP_79: checkov's known-versions list lags GCP's actual Cloud SQL
        # offering; cloud_sql module already pins POSTGRES_17 (current latest).
        # CKV_GCP_109: cloud_sql module already sets log_min_messages = "error"
        # (the value the check's own guide recommends); false positive.
        # CKV_GCP_60: Cloud SQL requires public IP, private IP (VPC peering),
        # or PSC — no VPC/PSC config exists in this project (deliberate, to
        # avoid a Serverless VPC Access connector's recurring cost), so
        # public IP is the only viable option. The Cloud Run Auth Proxy
        # socket mount still authenticates via the Cloud SQL Admin API +
        # mutual TLS rather than exposing an open port.
        entry: uvx --from 'checkov' checkov -d terraform --quiet --compact --skip-check CKV_GCP_62,CKV_GCP_114,CKV_GCP_28,CKV_GCP_125,CKV_GCP_49,CKV_GCP_41,CKV_GCP_73,CKV_GCP_84,CKV_GCP_6,CKV_GCP_79,CKV_GCP_109,CKV_GCP_60
        files: ^terraform/
        language: system
        pass_filenames: false
      - id: terraform-deny-public
        name: terraform deny-public bucket guard
        # Path-scoped: fails if ANY non-CDN bucket lacks public_access_prevention=
        # "enforced" + uniform access, or if any bucket gets an anonymous WRITE.
        entry: uv run python scripts/ensure_deny_public.py terraform --cdn-origin-resource terraform/modules/static_bucket/main.tf:google_storage_bucket.bucket
        files: ^terraform/
        language: system
        pass_filenames: false
