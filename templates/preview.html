<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cv_name }} — CV preview · {{ theme }}</title>
    {% include "_theme_head.html" %}
</head>
<body class="flex h-screen flex-col bg-slate-100 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200">
    {% set qs = ('&consent=1' if consent else '') ~ ('&company=' ~ (company|urlencode) if company else '') %}
    <header class="z-40 flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-slate-200 bg-white py-2 pl-4 pr-16 shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <div class="flex items-center gap-3">
            <a href="/" class="text-sm font-medium text-blue-600 hover:underline dark:text-blue-400">&larr; Home</a>
            <span class="text-sm text-slate-300 dark:text-slate-700">|</span>
            <nav class="flex items-center gap-1" aria-label="CV themes">
                {% for t in themes %}
                <a href="/cv/preview?theme={{ t }}{{ qs }}"
                   class="rounded-md px-2 py-1 text-sm transition
                          {% if t == theme %}bg-slate-900 font-semibold text-white dark:bg-white dark:text-slate-900{% else %}text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800{% endif %}">
                    {{ t }}
                </a>
                {% endfor %}
            </nav>
        </div>
        <a href="/cv/pdf?theme={{ theme }}{{ qs }}"
           class="rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-500">
            Download PDF
        </a>
    </header>

    {% set toggle_position = 'fixed right-4 top-2' %}
    {% include "_theme_toggle.html" %}

    <iframe src="/cv/html?theme={{ theme }}{{ qs }}" title="Rendered CV preview"
            class="min-h-0 w-full flex-1 border-0 bg-white"></iframe>
</body>
</html>
